apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-canary
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: canary
        variant: canary
    spec:
      containers:
        - name: app
          image: ACEEST_DOCKERHUB/aceest-fitness-app:latest
          imagePullPolicy: Always
          env:
            - name: APP_VERSION
              value: "2.0.0-canary"
            - name: DEPLOY_VARIANT
              value: "canary"
          ports:
            - containerPort: 5000
