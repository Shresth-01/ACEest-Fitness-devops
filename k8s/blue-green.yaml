apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-green
  namespace: aceest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      track: green
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: green
        variant: green
    spec:
      containers:
        - name: app
          image: ACEEST_DOCKERHUB/aceest-fitness-app:latest
          imagePullPolicy: Always
          env:
            - name: APP_VERSION
              value: "2.0.0-green"
            - name: DEPLOY_VARIANT
              value: "green"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
