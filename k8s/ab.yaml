apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-version-b
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: version-b
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: version-b
        variant: version-b
    spec:
      containers:
        - name: app
          image: ACEEST_DOCKERHUB/aceest-fitness-app:latest
          imagePullPolicy: Always
          env:
            - name: APP_VERSION
              value: "2.0.0-b"
            - name: DEPLOY_VARIANT
              value: "version-b"
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-version-b
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    track: version-b
  ports:
    - port: 80
      targetPort: 5000
