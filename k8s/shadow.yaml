apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: shadow
        variant: shadow
    spec:
      containers:
        - name: app
          image: ACEEST_DOCKERHUB/aceest-fitness-app:latest
          imagePullPolicy: Always
          env:
            - name: APP_VERSION
              value: "2.0.0-shadow"
            - name: DEPLOY_VARIANT
              value: "shadow"
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-shadow
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    track: shadow
  ports:
    - port: 80
      targetPort: 5000
