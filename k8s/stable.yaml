apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-stable
  namespace: aceest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: stable
        variant: stable
    spec:
      containers:
        - name: app
          image: ACEEST_DOCKERHUB/aceest-fitness-app:latest
          imagePullPolicy: Always
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: DEPLOY_VARIANT
              value: "stable"
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    track: stable
  ports:
    - port: 80
      targetPort: 5000
